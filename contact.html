<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Trishir Singh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: var(--bg-primary);
        }
        .contact-container {
            max-width: 800px;
            width: 100%;
        }
        .contact-header {
            text-align: center;
            margin-bottom: 60px;
        }
        .contact-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 300;
            color: var(--text-dark);
            margin-bottom: 20px;
        }
        .contact-header p {
            font-size: 1.125rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }
        .contact-form-wrapper {
            background: var(--bg-secondary);
            padding: 60px;
            border: 1px solid var(--border);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 40px;
            color: var(--accent-primary);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: var(--accent-hover);
        }
    </style>
</head>
<body>
    <div class="contact-page">
        <div class="contact-container">
            <a href="index.html" class="back-link">← Back to Home</a>
            <div class="contact-header">
                <h1>Get In Touch</h1>
                <p>Let's create something amazing together</p>
            </div>
            <div class="contact-form-wrapper">
                <form class="contact-form-custom">
                    <div class="form-group-custom">
                        <input type="text" placeholder="Name" class="form-input-custom" required>
                    </div>
                    <div class="form-group-custom">
                        <input type="email" placeholder="Email" class="form-input-custom" required>
                    </div>
                    <div class="form-group-custom">
                        <input type="text" placeholder="Subject" class="form-input-custom" required>
                    </div>
                    <div class="form-group-custom">
                        <textarea placeholder="Message" class="form-input-custom form-textarea-custom" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <span>Send Message</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script>
        const contactForm = document.querySelector('.contact-form-custom');
        if (contactForm) {
            contactForm.addEventListener('submit', (e) => {
                e.preventDefault();
                alert('Thank you for your message. I will get back to you soon.');
                contactForm.reset();
            });
        }
    </script>
</body>
</html>
